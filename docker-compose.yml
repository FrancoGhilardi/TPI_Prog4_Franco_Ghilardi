services:
  db:
    image: postgres:16-alpine
    container_name: foodstore-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodstore_db
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - foodstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodstore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: foodstore-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/foodstore_db
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-de-al-menos-32-caracteres}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    container_name: foodstore-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  foodstore_pgdata:
